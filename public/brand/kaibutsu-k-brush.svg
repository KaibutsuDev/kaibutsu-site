<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Kaibutsu">
  <title>Kaibutsu</title>
  <defs>
    <filter id="dry" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="5"/>
    </filter>
  </defs>
  <g fill="currentColor">
    <!-- Stem: solid slab, chisel cut top-left -->
    <path d="M150 112 L224 84 L224 420 L150 420 Z"/>
    <!-- Upper arm: angular block -->
    <path d="M232 262 L318 126 L392 126 L292 268 Z"/>
    <!-- Lower leg: thick brush sweep from the joint, ink thins into the tail -->
    <path d="M228 250 L300 232 C326 270 352 318 380 362 C392 382 404 400 416 418 C384 404 352 374 324 340 C296 306 262 282 228 288 Z" filter="url(#dry)"/>
    <!-- Dry-brush hairs trailing off the tail -->
    <path d="M330 300 C356 340 384 380 420 410 L414 416 C376 388 348 348 322 306 Z" filter="url(#dry)"/>
    <path d="M300 300 C326 336 352 368 388 400 L382 404 C346 376 318 342 294 306 Z" opacity="0.8" filter="url(#dry)"/>
  </g>
</svg>

